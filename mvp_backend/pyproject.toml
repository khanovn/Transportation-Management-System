[project]
name = "invoice-ar-mvp"
version = "0.1.0"
description = "MVP backend for invoice payment tracking and receivables management"
authors = ["Automation Agent <agent@example.com>"]
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.111",
    "uvicorn[standard]~=0.30",
    "sqlalchemy~=2.0",
    "pydantic[email]~=2.5",
    "python-multipart~=0.0.9",
    "alembic~=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.4",
    "httpx~=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
